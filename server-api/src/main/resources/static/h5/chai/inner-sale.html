<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>在售价目（内部）</title>
  <link rel="stylesheet" href="/h5/assets/css/chai-sale.css?v=20260918b"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-list-filter.css?v=20260918c"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-sale-stock.css?v=20260918b"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-inner.css?v=20260918b"/>
</head>
<body class="inner-sale">
  <header class="top">
    <div class="top-main">
      <div class="top-text">
        <h1>在售价目 <span class="inner-tag">内部</span></h1>
        <p class="sub">销售查询</p>
      </div>
    </div>
  </header>

  <form class="inner-search" id="searchForm">
    <div class="inner-search-row">
      <div class="inner-search-field">
        <input type="search" id="keyword" name="keyword" placeholder="品牌/品名" autocomplete="off"/>
        <button type="submit">搜索</button>
      </div>
    </div>
  </form>

  <div class="list-toolbar" id="listToolbar">
    <div class="list-toolbar-left">
      <select id="recycleSelect" name="recycleRecent" aria-label="列表范围">
        <option value="">全部</option>
        <option value="1">新回收</option>
      </select>
      <select id="whSelect" name="whId" aria-label="仓库筛选">
        <option value="">全部仓</option>
      </select>
    </div>
    <button type="button" class="filter-entry" id="filterEntryBtn" aria-label="筛选">
      <img class="filter-entry-icon" id="filterEntryIcon" src="/h5/assets/image/filter_off.png" alt=""/>
      <span>筛选</span>
    </button>
  </div>

  <div class="filter-bar" id="filterBar" hidden>
    <span id="filterText"></span>
    <button type="button" class="link-btn" id="clearFilterBtn">返回全部</button>
  </div>

  <p class="meta" id="meta"></p>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>暂无有货商品</p>
  <div class="pager" id="pager" hidden>
    <button type="button" id="prevBtn">上一页</button>
    <span class="pager-mid">
      <input type="number" class="page-input" id="pageInput" min="1" inputmode="numeric" aria-label="页码"/>
      <span class="page-sep">/</span>
      <span id="pageTotal">1</span>
      <button type="button" class="page-go" id="pageGoBtn">跳转</button>
    </span>
    <button type="button" id="nextBtn">下一页</button>
  </div>

  <div class="filter-drawer" id="filterDrawer" hidden>
    <div class="filter-drawer-mask" data-filter-close="1"></div>
    <div class="filter-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="filterDrawerTitle">
      <div class="filter-drawer-hd">
        <h2 id="filterDrawerTitle">筛选</h2>
        <button type="button" class="filter-drawer-close" data-filter-close="1" aria-label="关闭">×</button>
      </div>
      <div class="filter-drawer-bd">
        <section class="filter-section">
          <h3 class="filter-section-title">品牌</h3>
          <input type="search" class="filter-brand-search" id="brandFilterKw" placeholder="搜索品牌" autocomplete="off"/>
          <div class="filter-tags" id="brandTags"></div>
        </section>
        <section class="filter-section">
          <h3 class="filter-section-title">茶类</h3>
          <div class="filter-tags" id="typeTags"></div>
        </section>
      </div>
      <div class="filter-drawer-ft">
        <button type="button" class="filter-btn-reset" id="filterResetBtn">重置</button>
        <button type="button" class="filter-btn-ok" id="filterConfirmBtn">确定</button>
      </div>
    </div>
  </div>

  <div class="gallery" id="gallery" hidden>
    <div class="gallery-mask" data-gallery-close="1"></div>
    <button type="button" class="gallery-close" data-gallery-close="1" aria-label="关闭">×</button>
    <button type="button" class="gallery-nav prev" id="galleryPrev" aria-label="上一张">‹</button>
    <img class="gallery-img" id="galleryImg" alt=""/>
    <button type="button" class="gallery-nav next" id="galleryNext" aria-label="下一张">›</button>
    <p class="gallery-index" id="galleryIndex"></p>
  </div>

  <script src="/h5/assets/js/chai-sale-stock.js?v=20260918c"></script>
  <script src="/h5/assets/js/chai-list-filter.js?v=20260918c"></script>
  <script src="/h5/assets/js/chai-inner-util.js?v=20260918c"></script>
  <script src="/h5/assets/js/chai-inner-sale.js?v=20260918c"></script>
</body>
</html>
