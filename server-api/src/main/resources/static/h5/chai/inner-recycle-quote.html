<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>回收报价单（内部）</title>
  <link rel="stylesheet" href="/h5/assets/css/chai-sale.css?v=20260920c"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-inner.css?v=20260920c"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-recycle-quote.css?v=20260920c"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-inner-recycle-quote.css?v=20260923a"/>
</head>
<body class="inner-recycle-quote">
  <header class="nav">
    <a class="nav-back" href="/h5/chai/inner-recycle.html" aria-label="返回回收价目">
      <img class="nav-back-img" src="/h5/assets/image/back.png?v=20260920g" alt=""/>
    </a>
    <h1 class="nav-title">回收报价单 <span class="inner-tag">内部</span></h1>
    <span class="nav-spacer" aria-hidden="true"></span>
  </header>

  <p class="meta" id="meta"></p>
  <div class="cart-toolbar" id="cartToolbar" hidden>
    <button type="button" class="nav-clear" id="clearBtn">清空</button>
  </div>
  <ul class="list quote-list" id="list"></ul>
  <p class="empty" id="empty" hidden>
    回收报价单是空的<br/>
    <a href="/h5/chai/inner-recycle.html">去回收价目看看</a>
  </p>

  <footer class="quote-bar" id="quoteBar" hidden>
    <div class="quote-bar-sum">
      <div class="quote-bar-total">合计<strong id="totalAmount">¥0</strong></div>
      <div class="quote-bar-hint">可改单价与数量 · 仅本机</div>
    </div>
    <div class="quote-bar-actions">
      <button type="button" class="quote-copy" id="copyBtn">生成文字</button>
      <button type="button" class="quote-img" id="imgBtn">生成图片</button>
    </div>
  </footer>

  <div class="modal" id="clearModal" hidden>
    <div class="modal-mask" data-clear-close="1"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
      <h2 class="modal-title" id="clearTitle">清空回收报价单</h2>
      <div class="modal-body">确定清空回收报价单？清空后需重新添加商品。</div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" id="clearCancel" data-clear-close="1">取消</button>
        <button type="button" class="modal-ok modal-ok-danger" id="clearOk">清空</button>
      </div>
    </div>
  </div>

  <div id="quoteCaptureRoot" class="quote-capture-root" aria-hidden="true"></div>

  <div class="capture-loading" id="captureLoading" hidden>
    <div class="capture-loading-mask"></div>
    <p class="capture-loading-text">正在生成图片…</p>
  </div>

  <div class="capture-preview" id="capturePreview" hidden>
    <div class="capture-preview-mask" data-cap-close="1"></div>
    <div class="capture-preview-panel" role="dialog" aria-modal="true">
      <div class="capture-preview-head">
        <h2 class="capture-preview-title">回收报价单图片</h2>
        <button type="button" class="capture-preview-x" data-cap-close="1" aria-label="关闭">×</button>
      </div>
      <p class="capture-preview-hint" id="captureHint">长按下方图片可保存到相册</p>
      <div class="capture-preview-body">
        <img class="capture-preview-img" id="captureImg" alt="回收报价单截图"/>
      </div>
      <div class="capture-preview-actions">
        <button type="button" class="capture-preview-close" data-cap-close="1">关闭</button>
        <button type="button" class="capture-preview-save" id="captureSave" hidden>保存文件</button>
      </div>
    </div>
  </div>

  <script src="/h5/assets/vendor/modern-screenshot.js?v=20260920c"></script>
  <script src="/h5/assets/js/dom-to-image.js?v=20260920c"></script>
  <script src="/h5/assets/js/chai-inner-util.js?v=20260920c"></script>
  <script src="/h5/assets/js/chai-recycle-quote.js?v=20260920c"></script>
  <script src="/h5/assets/js/chai-inner-recycle-quote.js?v=20260923a"></script>
</body>
</html>
