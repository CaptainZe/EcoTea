<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>询价单</title>
  <link rel="stylesheet" href="/h5/assets/css/chai-sale.css?v=20260924d"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-sale-stock.css?v=20260924d"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-inquiry-cart.css?v=20260924d"/>
  <link rel="stylesheet" href="/h5/assets/css/chai-sale-cart.css?v=20260924d"/>
</head>
<body>
  <header class="nav">
    <a class="nav-back" href="/h5/chai/sale.html" aria-label="返回价格目录">
      <img class="nav-back-img" src="/h5/assets/image/back.png?v=202609185" alt=""/>
    </a>
    <h1 class="nav-title">询价单</h1>
    <span class="nav-spacer" aria-hidden="true"></span>
  </header>

  <p class="meta" id="meta"></p>
  <div class="cart-toolbar" id="cartToolbar" hidden>
    <button type="button" class="nav-clear" id="clearBtn">清空</button>
  </div>
  <ul class="list cart-list" id="list"></ul>
  <p class="empty" id="empty" hidden>
    询价单是空的<br/>
    <a href="/h5/chai/sale.html">去价格目录看看</a>
  </p>

  <footer class="cart-bar" id="cartBar" hidden>
    <div class="cart-bar-sum">
      <div class="cart-bar-total">合计<strong id="totalAmount">¥0</strong></div>
      <div class="cart-bar-hint" id="cartBarHint">生成后发给客服咨询</div>
    </div>
    <div class="cart-bar-actions">
      <button type="button" class="cart-copy" id="copyBtn">去询价·文字</button>
      <button type="button" class="cart-img" id="imgBtn">去询价·图片</button>
      <a class="cart-cs" href="/h5/about.html">立即咨询</a>
    </div>
  </footer>

  <div class="modal" id="clearModal" hidden>
    <div class="modal-mask" data-clear-close="1"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
      <h2 class="modal-title" id="clearTitle">清空询价单</h2>
      <div class="modal-body">确定清空询价单？清空后需重新添加商品。</div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" id="clearCancel" data-clear-close="1">取消</button>
        <button type="button" class="modal-ok modal-ok-danger" id="clearOk">清空</button>
      </div>
    </div>
  </div>

  <div class="swap-sheet" id="swapSheet" hidden>
    <div class="swap-sheet-mask" data-swap-close="1"></div>
    <div class="swap-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="swapTitle">
      <div class="swap-sheet-head">
        <h2 class="swap-sheet-title" id="swapTitle">换同款</h2>
        <button type="button" class="swap-sheet-x" data-swap-close="1" aria-label="关闭">×</button>
      </div>
      <p class="swap-sheet-hint" id="swapHint"></p>
      <ul class="list swap-list" id="swapList"></ul>
      <p class="swap-empty" id="swapEmpty" hidden>暂无其它同款</p>
    </div>
  </div>

  <div id="quoteCaptureRoot" class="quote-capture-root" aria-hidden="true"></div>

  <div class="capture-loading" id="captureLoading" hidden>
    <div class="capture-loading-mask"></div>
    <p class="capture-loading-text">正在生成图片…</p>
  </div>

  <div class="capture-preview" id="capturePreview" hidden>
    <div class="capture-preview-mask" data-cap-close="1"></div>
    <div class="capture-preview-panel" role="dialog" aria-modal="true">
      <div class="capture-preview-head">
        <h2 class="capture-preview-title">询价单图片</h2>
        <button type="button" class="capture-preview-x" data-cap-close="1" aria-label="关闭">×</button>
      </div>
      <p class="capture-preview-hint" id="captureHint">长按下方图片可保存到相册</p>
      <div class="capture-preview-body">
        <img class="capture-preview-img" id="captureImg" alt="询价单截图"/>
      </div>
      <div class="capture-preview-actions">
        <button type="button" class="capture-preview-close" data-cap-close="1">关闭</button>
        <button type="button" class="capture-preview-save" id="captureSave" hidden>保存文件</button>
      </div>
    </div>
  </div>

  <script src="/h5/assets/vendor/modern-screenshot.js?v=20260921a"></script>
  <script src="/h5/assets/js/dom-to-image.js?v=20260921a"></script>
  <script src="/h5/assets/js/chai-sale-stock.js?v=20260924d"></script>
  <script src="/h5/assets/js/chai-inquiry-cart.js?v=20260924d"></script>
  <script src="/h5/assets/js/chai-sale-cart.js?v=20260924d"></script>
</body>
</html>
