spring:
  profiles:
    active: dev
  application:
    name: tea-api

server:
  port: 8081

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      table-underline: true

logging:
  level:
    root: INFO
    com.ecotea.api: DEBUG

# 网站备案页脚（H5 通用）；填真实文案后生效，空则不展示
ecotea:
  beian:
    icp-text: ""
    icp-url: "https://beian.miit.gov.cn"
    mps-text: ""
    mps-url: ""
