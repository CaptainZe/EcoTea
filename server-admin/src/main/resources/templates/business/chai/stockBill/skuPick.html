<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/aun/Timo">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <title>选择商品</title>
    <style>
        body.timo-layout-page {
            padding-bottom: 64px;
        }
        .sku-pick-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            padding: 10px 16px;
            background: #fff;
            border-top: 1px solid #e6e6e6;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
    </style>
</head>
<body class="timo-layout-page">
<div class="layui-card">
    <div class="layui-card-header timo-card-header">
        <span><i class="fa fa-bars"></i> 选择商品</span>
    </div>
    <div class="layui-card-body">
        <div class="layui-row timo-card-screen">
            <div class="layui-form pull-left layui-form-pane timo-search-box">
                <input type="hidden" name="billType" th:value="${billType}">
                <div class="layui-inline">
                    <label class="layui-form-label">商品名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" th:value="${param.name}" placeholder="模糊查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">品牌</label>
                    <div class="layui-input-block timo-search-status" style="width: 160px;">
                        <select name="brand" class="layui-input timo-search-select" lay-search>
                            <option value="">全部</option>
                            <option th:each="b : ${brandList}" th:value="${b.id}"
                                    th:selected="${param.brand != null and !#lists.isEmpty(param.brand) and param.brand[0] == (b.id + '')}"
                                    th:text="${b.name}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">年份</label>
                    <div class="layui-input-block" style="width: 100px;">
                        <input type="number" name="year" th:value="${param.year}" placeholder="精确"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">生产批次</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="prodBatch" mo:dict="CHAI_PROD_BATCH"
                                mo-selected="${param.prodBatch}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="status" mo:dict="CHAI_STATUS"
                                mo-selected="${param.status}"></select>
                    </div>
                </div>
                <div class="layui-inline" th:unless="${inbound}">
                    <label class="layui-form-label">是否删除</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="deleted">
                            <option th:each="opt : ${deletedFilterOptions}"
                                    th:value="${opt.code}"
                                    th:text="${opt.message}"
                                    th:selected="${(param.deleted == null or #lists.isEmpty(param.deleted))
                                        ? (opt.code == 0)
                                        : (param.deleted[0] == (opt.code + ''))}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">SKU编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="skuCode" th:value="${param.skuCode}" placeholder="精确查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">SPU编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="querySpuCode" th:value="${param.querySpuCode}" placeholder="精确查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn timo-search-btn">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="timo-table-wrap">
            <table class="layui-table timo-table">
                <thead>
                <tr>
                    <th class="timo-table-checkbox">
                        <label class="timo-checkbox"><input type="checkbox">
                            <i class="layui-icon layui-icon-ok"></i></label>
                    </th>
                    <th width="80" class="sortable" data-field="status">状态</th>
                    <th width="90" class="sortable" data-field="starLevel">星级</th>
                    <th width="100" class="sortable" data-field="brand">品牌</th>
                    <th width="220">商品名称</th>
                    <th width="120">规格</th>
                    <th width="80" class="sortable" data-field="year">年份</th>
                    <th width="90" class="sortable" data-field="prodBatch">生产批次</th>
                    <th width="100" class="sortable" data-field="officialPrice">官方价 / 元</th>
                    <th width="110" class="sortable" data-field="salePrice">销售价 / 元</th>
                    <th width="110" class="sortable" data-field="recyclePrice">回收价 / 元</th>
                    <th width="120">展示图</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${list}">
                    <td><label class="timo-checkbox"><input type="checkbox" th:value="${item.id}">
                        <i class="layui-icon layui-icon-ok"></i></label></td>
                    <td th:text="${#dicts.keyValue('CHAI_STATUS', item.status)}"
                        th:style="${item.status == 1} ? 'color: #16A34A; font-weight: 600;' : 'color: #9CA3AF; font-weight: 600;'"></td>
                    <td th:text="${#dicts.keyValue('STAR_LEVEL', item.starLevel)}"></td>
                    <td th:text="${item.brandName}"></td>
                    <td>
                        <div th:title="${item.name}">
                            <span th:text="${item.name}"></span>
                            <span th:if="${item.deleted == 1}" style="color: #9CA3AF; margin-left: 6px; font-weight: 600;">已删除</span>
                        </div>
                        <div th:if="${item.skuCode != null and !#strings.isEmpty(item.skuCode)}"
                             th:text="${item.skuCode}" th:title="${item.skuCode}"
                             style="color: #9CA3AF; font-size: 12px; line-height: 1.4; margin-top: 2px;"></div>
                    </td>
                    <td th:text="${item.specShow}" th:title="${item.specShow}"></td>
                    <td th:text="${item.year}"></td>
                    <td th:text="${#dicts.keyValue('CHAI_PROD_BATCH', item.prodBatch)}"></td>
                    <td style="background-color: #EFF6FF; color: #1E40AF;" th:text="${item.officialPriceShow}"></td>
                    <td style="background-color: #ECFDF5; color: #047857;" th:text="${item.salePriceShow}"></td>
                    <td style="background-color: #FFFBEB; color: #B45309;" th:text="${item.recyclePriceShow}"></td>
                    <td>
                        <th:block th:replace="/common/fragment :: previewImgList(${item.showImageList}, ${'pick-show-' + item.id})"></th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="/common/fragment :: page"></div>
    </div>
</div>

<div class="sku-pick-footer">
    <button type="button" class="layui-btn js-confirm-pick">
        <i class="fa fa-check"></i> 添加所选
    </button>
</div>

<script th:replace="/common/template :: script"></script>
<script>
    layui.use(['layer'], function () {
        var layer = layui.layer;
        var $ = layui.$;
        $(document).on('click', '.js-confirm-pick', function () {
            var idList = [];
            $('.timo-table tbody .timo-checkbox :checkbox:checked').each(function () {
                idList.push($(this).val());
            });
            if (idList.length === 0) {
                layer.msg('请至少勾选一条商品');
                return;
            }
            if (window.parent && typeof window.parent.addStockBillSkus === 'function') {
                window.parent.addStockBillSkus(idList);
                var frameIndex = window.parent.layer.getFrameIndex(window.name);
                window.parent.layer.close(frameIndex);
            } else {
                layer.msg('无法回传父页面');
            }
        });
    });
</script>
</body>
</html>
