<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/aun/Timo">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <title>分仓结存</title>
    <style>
        .wh-summary {
            margin-bottom: 14px;
            padding: 12px 14px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.7;
            color: #374151;
        }
        .wh-summary b {
            color: #111827;
        }
        .wh-total {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
        }
        .wh-qty {
            font-weight: 600;
            color: #111827;
        }
        .wh-qty.is-zero {
            color: #9CA3AF;
            font-weight: 400;
        }
        .wh-ratio {
            color: #6B7280;
            font-size: 12px;
        }
        .wh-sku-code {
            color: #6B7280;
            font-size: 12px;
        }
        .stock-deleted-tag {
            display: inline-block;
            margin-left: 6px;
            padding: 0 6px;
            font-size: 12px;
            line-height: 18px;
            color: #9CA3AF;
            border: 1px solid #D1D5DB;
            border-radius: 2px;
            vertical-align: middle;
        }
        .stock-status {
            display: inline-block;
            margin-left: 8px;
            font-weight: 600;
            vertical-align: middle;
        }
        .stock-status.is-online { color: #16A34A; }
        .stock-status.is-offline { color: #9CA3AF; }
    </style>
</head>
<body>
<div class="layui-form timo-compile" style="padding: 12px 16px;">
    <th:block th:if="${errorMsg != null}">
        <div class="layui-bg-red" style="padding:12px;" th:text="${errorMsg}"></div>
    </th:block>
    <th:block th:if="${errorMsg == null}">
        <div class="wh-summary">
            <div>
                <b th:text="${stock.name}">-</b>
                <span class="stock-status"
                      th:classappend="${stock.status != null and stock.status == 1} ? ' is-online' : ' is-offline'"
                      th:text="${#dicts.keyValue('CHAI_STATUS', stock.status)}">-</span>
                <span th:if="${stock.deleted != null and stock.deleted == 1}" class="stock-deleted-tag">已删除</span>
            </div>
            <div class="wh-sku-code" th:text="${stock.skuCode}">-</div>
            <div>
                <span th:text="${stock.brandName}">-</span>
                · <span th:text="${stock.year}">-</span>
                <span th:text="${#dicts.keyValue('CHAI_PROD_BATCH', stock.prodBatch)}"></span>
                · <span th:text="${stock.specShow}">-</span>
            </div>
            <div style="margin-top:4px;">
                合计库存 <span class="wh-total" th:text="${stock.totalQty}">0</span> 件
                · 其中破损 <span class="wh-total" th:text="${stock.damageQty != null ? stock.damageQty : 0}">0</span> 件
            </div>
        </div>

        <table class="layui-table timo-table">
            <thead>
            <tr>
                <th>仓库</th>
                <th width="100">结存件数</th>
                <th width="100">其中破损</th>
                <th width="100">占比</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${whList == null or #lists.isEmpty(whList)}">
                <td colspan="4" style="text-align:center;color:#9CA3AF;">暂无分仓记录（入库过账后产生）</td>
            </tr>
            <tr th:each="row : ${whList}">
                <td th:text="${row.whName}"></td>
                <td>
                    <span class="wh-qty"
                          th:classappend="${row.qty == null or row.qty == 0} ? ' is-zero' : ''"
                          th:text="${row.qty}"></span>
                </td>
                <td>
                    <span class="wh-qty"
                          th:classappend="${row.damageQty == null or row.damageQty == 0} ? ' is-zero' : ''"
                          th:text="${row.damageQty != null ? row.damageQty : 0}"></span>
                </td>
                <td>
                    <span class="wh-ratio"
                          th:with="total=${stock.totalQty == null ? 0 : stock.totalQty},
                                   qty=${row.qty == null ? 0 : row.qty}"
                          th:text="${total > 0} ? (${#numbers.formatDecimal(qty * 100.0 / total, 1, 1)} + '%') : '-'"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="layui-form-item timo-finally" style="margin-top: 12px;">
            <button type="button" class="layui-btn btn-secondary close-popup">
                <i class="fa fa-times-circle"></i> 关闭
            </button>
        </div>
    </th:block>
</div>
<script th:replace="/common/template :: script"></script>
</body>
</html>
