<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/aun/Timo">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <title>茶叶库存</title>
    <style>
        .stock-deleted-tag {
            display: inline-block;
            margin-left: 6px;
            padding: 0 6px;
            font-size: 12px;
            line-height: 18px;
            color: #9CA3AF;
            border: 1px solid #D1D5DB;
            border-radius: 2px;
            vertical-align: middle;
        }
        .stock-qty {
            font-weight: 600;
            color: #111827;
        }
        .stock-qty.is-zero {
            color: #9CA3AF;
            font-weight: 400;
        }
        .col-num { text-align: right; }
    </style>
</head>
<body class="timo-layout-page">
<div class="layui-card">
    <div class="layui-card-header timo-card-header">
        <span><i class="fa fa-bars"></i> 茶叶库存</span>
        <i class="layui-icon layui-icon-refresh refresh-btn"></i>
    </div>
    <div class="layui-card-body">
        <div class="layui-row timo-card-screen">
            <div class="layui-form pull-left layui-form-pane timo-search-box">
                <div class="layui-inline">
                    <label class="layui-form-label">商品名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" th:value="${param.name}" placeholder="模糊查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">品牌</label>
                    <div class="layui-input-block timo-search-status" style="width: 160px;">
                        <select name="brand" class="layui-input timo-search-select" lay-search>
                            <option value="">全部</option>
                            <option th:each="b : ${brandList}" th:value="${b.id}"
                                    th:selected="${param.brand != null and !#lists.isEmpty(param.brand) and param.brand[0] == (b.id + '')}"
                                    th:text="${b.name}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">茶类</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="type" mo:dict="CHAI_TYPE"
                                mo-selected="${param.type}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">星级</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="starLevel" mo:dict="STAR_LEVEL"
                                mo-selected="${param.starLevel}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">年份</label>
                    <div class="layui-input-block" style="width: 100px;">
                        <input type="number" name="year" th:value="${param.year}" placeholder="精确"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">生产批次</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="prodBatch" mo:dict="CHAI_PROD_BATCH"
                                mo-selected="${param.prodBatch}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">SKU状态</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="status" mo:dict="CHAI_STATUS"
                                mo-selected="${param.status}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">是否删除</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="deleted">
                            <option th:each="opt : ${deletedFilterOptions}"
                                    th:value="${opt.code}"
                                    th:text="${opt.message}"
                                    th:selected="${(param.deleted == null or #lists.isEmpty(param.deleted))
                                        ? (opt.code == 0)
                                        : (param.deleted[0] == (opt.code + ''))}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">仓库</label>
                    <div class="layui-input-block timo-search-status" style="width: 160px;">
                        <select name="queryWhId" class="layui-input timo-search-select" lay-search>
                            <option value="">全部</option>
                            <option th:each="w : ${warehouseList}" th:value="${w.id}"
                                    th:selected="${param.queryWhId != null and !#lists.isEmpty(param.queryWhId) and param.queryWhId[0] == (w.id + '')}"
                                    th:text="${w.name}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">有库存</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="queryHasQty">
                            <option value="" th:selected="${param.queryHasQty == null or #lists.isEmpty(param.queryHasQty) or param.queryHasQty[0] == ''}">全部</option>
                            <option value="1" th:selected="${param.queryHasQty != null and !#lists.isEmpty(param.queryHasQty) and param.queryHasQty[0] == '1'}">有</option>
                            <option value="0" th:selected="${param.queryHasQty != null and !#lists.isEmpty(param.queryHasQty) and param.queryHasQty[0] == '0'}">无</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">SKU编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="skuCode" th:value="${param.skuCode}" placeholder="精确查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">SPU编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="querySpuCode" th:value="${param.querySpuCode}" placeholder="精确查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn timo-search-btn">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="timo-table-wrap">
            <table class="layui-table timo-table">
                <thead>
                <tr>
                    <th width="80">操作</th>
                    <th width="100" class="sortable col-num" data-field="totalQty">合计库存</th>
                    <th width="90">商品状态</th>
                    <th width="90">星级</th>
                    <th width="100">品牌</th>
                    <th width="220">商品名称</th>
                    <th width="120">规格</th>
                    <th width="80">年份</th>
                    <th width="90">生产批次</th>
                    <th width="100">过账人</th>
                    <th width="140" class="sortable" data-field="updateTime">更新时间</th>
                    <th width="140" class="sortable" data-field="createTime">建档时间</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${list}">
                    <td>
                        <a class="open-popup" style="color: #1D4ED8; font-weight: 600;" data-title="分仓结存"
                           th:attr="data-url=@{'/business/chai/stock/wh/'+${item.id}}" data-size="860,560">分仓</a>
                    </td>
                    <td class="col-num">
                        <span class="stock-qty" th:classappend="${item.totalQty == null or item.totalQty == 0} ? ' is-zero' : ''"
                              th:text="${item.totalQty}"></span>
                    </td>
                    <td th:text="${#dicts.keyValue('CHAI_STATUS', item.status)}"
                        th:style="${item.status == 1} ? 'color: #16A34A; font-weight: 600;' : 'color: #9CA3AF; font-weight: 600;'"></td>
                    <td th:text="${#dicts.keyValue('STAR_LEVEL', item.starLevel)}"></td>
                    <td th:text="${item.brandName}"></td>
                    <td>
                        <div>
                            <span th:text="${item.name}" th:title="${item.name}"></span>
                            <span th:if="${item.deleted != null and item.deleted == 1}" class="stock-deleted-tag">已删除</span>
                        </div>
                        <div th:if="${item.skuCode != null and !#strings.isEmpty(item.skuCode)}"
                             th:text="${item.skuCode}" th:title="${item.skuCode}"
                             style="color: #9CA3AF; font-size: 12px; line-height: 1.4; margin-top: 2px;"></div>
                    </td>
                    <td th:text="${item.specShow}" th:title="${item.specShow}"></td>
                    <td th:text="${item.year}"></td>
                    <td th:text="${#dicts.keyValue('CHAI_PROD_BATCH', item.prodBatch)}"></td>
                    <td th:text="${item.operator}"></td>
                    <td th:text="${#dates.format(new java.util.Date(item.updateTime.longValue()), 'yyyy/MM/dd HH:mm:ss')}"></td>
                    <td th:text="${#dates.format(new java.util.Date(item.createTime.longValue()), 'yyyy/MM/dd HH:mm:ss')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="/common/fragment :: page"></div>
    </div>
</div>
<script th:replace="/common/template :: script"></script>
</body>
</html>
