<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/aun/Timo">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <title>茶叶SPU</title>
</head>
<body class="timo-layout-page">
<div class="layui-card">
    <div class="layui-card-header timo-card-header">
        <span><i class="fa fa-bars"></i> 茶叶SPU</span>
        <i class="layui-icon layui-icon-refresh refresh-btn"></i>
    </div>
    <div class="layui-card-body">
        <div class="layui-row timo-card-screen">
            <div class="layui-form pull-left layui-form-pane timo-search-box">
                <div class="layui-inline">
                    <label class="layui-form-label">商品名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" th:value="${param.name}" placeholder="模糊查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">品牌</label>
                    <div class="layui-input-block timo-search-status" style="width: 160px;">
                        <select name="brand" class="layui-input timo-search-select" lay-search>
                            <option value="">全部</option>
                            <option th:each="b : ${brandList}" th:value="${b.id}"
                                    th:selected="${param.brand != null and !#lists.isEmpty(param.brand) and param.brand[0] == (b.id + '')}"
                                    th:text="${b.name}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">茶类</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="type" mo:dict="CHAI_TYPE"
                                mo-selected="${param.type}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">年份</label>
                    <div class="layui-input-block" style="width: 100px;">
                        <input type="number" name="year" th:value="${param.year}" placeholder="精确"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">生产批次</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="prodBatch" mo:dict="CHAI_PROD_BATCH"
                                mo-selected="${param.prodBatch}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">星级</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="starLevel" mo:dict="STAR_LEVEL"
                                mo-selected="${param.starLevel}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block timo-search-status" style="width: 120px;">
                        <select class="timo-search-select layui-input" name="status" mo:dict="CHAI_STATUS"
                                mo-selected="${param.status}"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">SPU编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="spuCode" th:value="${param.spuCode}" placeholder="精确查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn timo-search-btn">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </div>

            <div class="pull-right screen-btn-group">
                <button class="layui-btn open-popup" data-title="添加SPU"
                        th:attr="data-url=@{/business/chai/spu/edit}" data-size="1500,800">
                    <i class="fa fa-plus"></i> 添加
                </button>
                <div class="btn-group">
                    <button class="layui-btn">操作<span class="caret"></span></button>
                    <dl class="layui-nav-child layui-anim layui-anim-upbit">
                        <dd><a class="ajax-status" th:href="@{/business/chai/spu/status/1}">上架</a></dd>
                        <dd><a class="ajax-status" th:href="@{/business/chai/spu/status/0}">下架</a></dd>
                        <dd><a class="ajax-status" th:href="@{/business/chai/spu/delete}">删除</a></dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="timo-table-wrap">
            <table class="layui-table timo-table">
                <thead>
                <tr>
                    <th class="timo-table-checkbox">
                        <label class="timo-checkbox"><input type="checkbox">
                            <i class="layui-icon layui-icon-ok"></i></label>
                    </th>
                    <th width="140">操作</th>
                    <th width="80" class="sortable" data-field="status">状态</th>
                    <th width="80">SKU数</th>
                    <th width="90" class="sortable" data-field="starLevel">星级</th>
                    <th width="100" class="sortable" data-field="brand">品牌</th>
                    <th width="160">商品名称</th>
                    <th width="120">规格</th>
                    <th width="80" class="sortable" data-field="year">年份</th>
                    <th width="90" class="sortable" data-field="prodBatch">生产批次</th>
                    <th width="120">展示图</th>
                    <th width="120">实物图</th>
                    <th width="140">SPU编码</th>
                    <th width="90">操作人</th>
                    <th width="140" class="sortable" data-field="updateTime">更新时间</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${list}">
                    <td><label class="timo-checkbox"><input type="checkbox" th:value="${item.id}">
                        <i class="layui-icon layui-icon-ok"></i></label></td>
                    <td>
                        <a class="open-popup" style="color: #1D4ED8; font-weight: 600;" data-title="编辑SPU"
                           th:attr="data-url=@{'/business/chai/spu/edit/'+${item.id}}" data-size="1500,800">编辑</a>
                        <a class="open-popup" style="color: #047857; font-weight: 600;" data-title="维护SKU"
                           th:attr="data-url=@{'/business/chai/sku/editBySpu/'+${item.id}}" data-size="1500,800">SKU</a>
                        <a th:if="${item.status == 1}" class="ajax-get" style="color: #B45309; font-weight: 600;"
                           data-msg="下架将同时下架该SPU下全部SKU，是否确认？"
                           th:href="@{/business/chai/spu/status/0(ids=${item.id})}">下架</a>
                        <a th:if="${item.status != 1}" class="ajax-get" style="color: #16A34A; font-weight: 600;"
                           data-msg="上架将同时上架该SPU下全部SKU，是否确认？"
                           th:href="@{/business/chai/spu/status/1(ids=${item.id})}">上架</a>
                    </td>
                    <td th:text="${#dicts.keyValue('CHAI_STATUS', item.status)}"
                        th:style="${item.status == 1} ? 'color: #16A34A; font-weight: 600;' : 'color: #9CA3AF; font-weight: 600;'"></td>
                    <td th:text="${item.skuCount != null ? item.skuCount : 0}"></td>
                    <td th:text="${#dicts.keyValue('STAR_LEVEL', item.starLevel)}"></td>
                    <td th:text="${item.brandName}"></td>
                    <td th:text="${item.name}" th:title="${item.name}"></td>
                    <td th:text="${item.specShow}" th:title="${item.specShow}"></td>
                    <td th:text="${item.year}"></td>
                    <td th:text="${#dicts.keyValue('CHAI_PROD_BATCH', item.prodBatch)}"></td>
                    <td>
                        <th:block th:replace="/common/fragment :: previewImgList(${item.showImageList}, ${'spu-show-' + item.id})"></th:block>
                    </td>
                    <td>
                        <th:block th:replace="/common/fragment :: previewImgList(${item.realImageList}, ${'spu-real-' + item.id})"></th:block>
                    </td>
                    <td th:text="${item.spuCode}"></td>
                    <td th:text="${item.operator}"></td>
                    <td th:text="${#dates.format(new java.util.Date(item.updateTime.longValue()), 'yyyy/MM/dd HH:mm:ss')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="/common/fragment :: page"></div>
    </div>
</div>
<script th:replace="/common/template :: script"></script>
</body>
</html>
