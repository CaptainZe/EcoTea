<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/aun/Timo">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <title>选择整装SPU</title>
    <style>
        body.timo-layout-page {
            padding-bottom: 64px;
        }
        .pack-pick-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            padding: 10px 16px;
            background: #fff;
            border-top: 1px solid #e6e6e6;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
    </style>
</head>
<body class="timo-layout-page">
<div class="layui-card">
    <div class="layui-card-header timo-card-header">
        <span><i class="fa fa-bars"></i> 选择整装 SPU</span>
    </div>
    <div class="layui-card-body">
        <div class="layui-row timo-card-screen">
            <div class="layui-form pull-left layui-form-pane timo-search-box">
                <input type="hidden" name="excludeId" th:value="${excludeId}">
                <p style="color:#6B7280;margin:0 0 10px 0;font-size:13px;">
                    仅未删除、非品鉴款；支持名称 / 编码 / 条码精确或模糊筛选后单选。
                </p>
                <div class="layui-inline">
                    <label class="layui-form-label">商品名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" th:value="${param.name}" placeholder="模糊查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">品牌</label>
                    <div class="layui-input-block timo-search-status" style="width: 160px;">
                        <select name="brand" class="layui-input timo-search-select" lay-search>
                            <option value="">全部</option>
                            <option th:each="b : ${brandList}" th:value="${b.id}"
                                    th:selected="${param.brand != null and !#lists.isEmpty(param.brand) and param.brand[0] == (b.id + '')}"
                                    th:text="${b.name}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">SPU编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="spuCode" th:value="${param.spuCode}" placeholder="精确查询"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">条形码</label>
                    <div class="layui-input-block">
                        <input type="text" name="barcode" th:value="${param.barcode}" placeholder="精确查询"
                               autocomplete="off" class="layui-input js-barcode-search">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn timo-search-btn">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="timo-table-wrap">
            <table class="layui-table timo-table">
                <thead>
                <tr>
                    <th width="50">选</th>
                    <th width="80">状态</th>
                    <th width="100">品牌</th>
                    <th width="220">商品名称</th>
                    <th width="120">规格</th>
                    <th width="80">茶类</th>
                    <th width="80">年份</th>
                    <th width="90">生产批次</th>
                    <th width="100">官方价 / 元</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${list}"
                    th:attr="data-id=${item.id},
                             data-label=${(item.brandName != null ? item.brandName + ' ' : '')
                                + (item.name != null ? item.name : '')
                                + (item.spuCode != null and !#strings.isEmpty(item.spuCode) ? ' (' + item.spuCode + ')' : '')}">
                    <td>
                        <input type="radio" name="packPick" class="js-pack-radio"
                               th:value="${item.id}"
                               th:attr="data-label=${(item.brandName != null ? item.brandName + ' ' : '')
                                  + (item.name != null ? item.name : '')
                                  + (item.spuCode != null and !#strings.isEmpty(item.spuCode) ? ' (' + item.spuCode + ')' : '')}">
                    </td>
                    <td th:text="${#dicts.keyValue('CHAI_STATUS', item.status)}"
                        th:style="${item.status == 1} ? 'color: #16A34A; font-weight: 600;' : 'color: #9CA3AF; font-weight: 600;'"></td>
                    <td th:text="${item.brandName}"></td>
                    <td>
                        <div th:text="${item.name}" th:title="${item.name}"></div>
                        <div th:if="${item.spuCode != null and !#strings.isEmpty(item.spuCode)}"
                             th:text="${item.spuCode}"
                             style="color: #9CA3AF; font-size: 12px; line-height: 1.4; margin-top: 2px;"></div>
                    </td>
                    <td th:text="${item.specShow}" th:title="${item.specShow}"></td>
                    <td th:text="${#dicts.keyValue('CHAI_TYPE', item.type)}"></td>
                    <td th:text="${item.year}"></td>
                    <td th:text="${#dicts.keyValue('CHAI_PROD_BATCH', item.prodBatch)}"></td>
                    <td th:text="${item.officialPriceShow}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="/common/fragment :: page"></div>
    </div>
</div>

<div class="pack-pick-footer">
    <button type="button" class="layui-btn js-confirm-pack">确认选择</button>
</div>

<script th:replace="/common/template :: script"></script>
<script th:inline="javascript">
    layui.use(['layer', 'form'], function () {
        var layer = layui.layer;
        var form = layui.form;
        var $ = layui.$;
        form.render();

        $(document).on('click', '.timo-table tbody tr', function (e) {
            if ($(e.target).is('input,a,button')) {
                return;
            }
            var $radio = $(this).find('.js-pack-radio');
            if ($radio.length) {
                $radio.prop('checked', true);
            }
        });

        $(document).on('click', '.js-confirm-pack', function () {
            var $sel = $('.js-pack-radio:checked');
            if (!$sel.length) {
                layer.msg('请先选择一条 SPU');
                return;
            }
            var row = {
                id: $sel.val(),
                label: $sel.attr('data-label') || ''
            };
            if (window.parent && typeof window.parent.onPackSpuPicked === 'function') {
                window.parent.onPackSpuPicked(row);
                var frameIndex = window.parent.layer.getFrameIndex(window.name);
                window.parent.layer.close(frameIndex);
            } else {
                layer.msg('无法回传父页面');
            }
        });
    });
</script>
</body>
</html>
