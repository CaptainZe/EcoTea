<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/aun/Timo">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <title>维护条形码</title>
    <style>
        .bc-form .layui-form-label { width: 100px; }
        .bc-form .layui-input-block { margin-left: 130px; max-width: 560px; }
        .bc-form .field-tip { color: #6B7280; font-size: 12px; line-height: 1.6; margin-top: 6px; }
        .bc-spu-card {
            background: #F8FAFC;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 14px;
        }
        .bc-spu-card-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .bc-spu-name {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            line-height: 1.4;
        }
        .bc-spu-status {
            flex-shrink: 0;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .bc-spu-status.is-online { color: #166534; background: #DCFCE7; }
        .bc-spu-status.is-offline { color: #6B7280; background: #F3F4F6; }
        .bc-spu-meta { margin-top: 6px; color: #6B7280; font-size: 13px; }
        .bc-spu-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .bc-spu-tags span {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #E5E7EB;
            color: #6B7280;
            font-size: 12px;
        }
        .bc-spu-tags b {
            margin-left: 4px;
            font-weight: 600;
            color: #111827;
        }
        .bc-legacy-tip {
            margin-top: 10px;
            padding: 8px 10px;
            background: #FFFBEB;
            border: 1px solid #FDE68A;
            border-radius: 6px;
            color: #92400E;
            font-size: 12px;
            line-height: 1.5;
        }
        .bc-input-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .bc-input-row .layui-input { flex: 1; min-width: 200px; max-width: 320px; letter-spacing: 1px; font-family: Consolas, Monaco, monospace; }
        .bc-panel {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: flex-start;
            margin-top: 8px;
        }
        .bc-panel-left { flex: 1; min-width: 280px; }
        .bc-panel-right { flex: 0 0 auto; }

        .bc-list {
            list-style: none;
            margin: 0 0 12px;
            padding: 0;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        .bc-list-empty {
            padding: 14px 12px;
            color: #9CA3AF;
            font-size: 13px;
            text-align: center;
        }
        .bc-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid #F3F4F6;
            cursor: pointer;
        }
        .bc-list-item:last-child { border-bottom: none; }
        .bc-list-item:hover { background: #F8FAFC; }
        .bc-list-item.is-active {
            background: #EFF6FF;
            box-shadow: inset 3px 0 0 #3B82F6;
        }
        .bc-list-code {
            flex: 1;
            font-family: Consolas, Monaco, monospace;
            letter-spacing: 1px;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }
        .bc-list-tag {
            flex-shrink: 0;
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 999px;
            background: #F3F4F6;
            color: #6B7280;
        }
        .bc-list-tag.is-sys { background: #DBEAFE; color: #1D4ED8; }
        .bc-list-tag.is-gb { background: #DCFCE7; color: #166534; }

        /* 标签预览 / 打印区：横版 80mm × 60mm（与批量打印一致） */
        .bc-label-wrap {
            border: 1px dashed #CBD5E1;
            border-radius: 6px;
            padding: 10px;
            background: #F1F5F9;
        }
        .bc-label {
            width: 80mm;
            height: 60mm;
            background: #fff;
            color: #111;
            padding: 2.5mm 3mm 2mm;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            line-height: 1.35;
            overflow: hidden;
        }
        .bc-label-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 3px;
            word-break: break-all;
            max-height: 2.7em;
            overflow: hidden;
        }
        .bc-label-row {
            font-size: 11px;
            color: #333;
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bc-label-img {
            display: block;
            margin: 3mm auto 1mm;
            width: 68mm;
            height: 14mm;
            object-fit: contain;
        }
        .bc-label-img.is-empty { display: none; }
        .bc-label-code {
            text-align: center;
            font-size: 12px;
            letter-spacing: 1.5px;
            font-family: Consolas, Monaco, monospace;
            font-weight: 600;
            min-height: 16px;
        }
        .bc-label-empty {
            color: #9CA3AF;
            font-size: 12px;
            text-align: center;
            padding: 16px 8px;
        }

        @media print {
            @page {
                size: 80mm 60mm;
                margin: 0;
            }
            html, body {
                width: 80mm !important;
                height: 60mm !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
                background: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            body * { visibility: hidden !important; }
            .bc-print-only, .bc-print-only * { visibility: visible !important; }
            .bc-print-only {
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                width: 80mm !important;
                height: 60mm !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                background: #fff !important;
                overflow: hidden !important;
                box-shadow: none !important;
                transform: none !important;
                zoom: 1 !important;
            }
            .bc-label {
                width: 80mm !important;
                height: 60mm !important;
                padding: 2.5mm 3mm 2mm !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
                transform: none !important;
            }
            .bc-label-title { font-size: 13px !important; }
            .bc-label-row { font-size: 11px !important; }
            .bc-label-code { font-size: 12px !important; }
            .bc-label-img {
                margin: 2.5mm auto 1mm !important;
                width: 68mm !important;
                height: 13mm !important;
            }
        }
    </style>
</head>
<body>
<div class="timo-compile" th:if="${errorMsg != null}">
    <div style="color:#DC2626;padding:24px;" th:text="${errorMsg}"></div>
</div>
<div class="timo-compile" th:unless="${errorMsg != null}">
    <form id="bcForm" class="layui-form bc-form" onsubmit="return false;">
        <input type="hidden" name="id" th:value="${editItem.id}"/>

        <div class="bc-spu-card">
            <div class="bc-spu-card-hd">
                <div class="bc-spu-name" th:text="${editItem.name}">-</div>
                <span class="bc-spu-status"
                      th:classappend="${editItem.status == 1} ? ' is-online' : ' is-offline'"
                      th:text="${#dicts.keyValue('CHAI_STATUS', editItem.status)}">-</span>
            </div>
            <div class="bc-spu-meta">
                <span th:text="${editItem.spuCode}">-</span>
                · 锚点
                <span th:text="${editItem.year}">-</span>
                <span th:text="${#dicts.keyValue('CHAI_PROD_BATCH', editItem.prodBatch)}">-</span>
            </div>
            <div class="bc-spu-tags">
                <span>品牌 <b th:text="${editItem.brandName != null ? editItem.brandName : '-'}">-</b></span>
                <span>等级 <b th:text="${gradeName != null and !#strings.isEmpty(gradeName) ? gradeName : '-'}">-</b></span>
                <span>规格 <b th:text="${editItem.specShow != null and !#strings.isEmpty(editItem.specShow) ? editItem.specShow : '-'}">-</b></span>
                <span>保质期 <b th:text="${editItem.expirationName != null ? editItem.expirationName : '-'}">-</b></span>
            </div>
            <div class="bc-legacy-tip"
                 th:if="${#lists.isEmpty(barcodeList) and legacyBarcode != null and !#strings.isEmpty(legacyBarcode)}">
                旧单列仍有条码 <b th:text="${legacyBarcode}">-</b>，尚未迁入多码表。可在此重新添加，或等工具箱迁移。
            </div>
        </div>

        <div class="bc-panel">
            <div class="bc-panel-left">
                <div class="layui-form-item">
                    <label class="layui-form-label">已有条码</label>
                    <div class="layui-input-block">
                        <ul class="bc-list" id="bcList">
                            <li class="bc-list-empty" th:if="${#lists.isEmpty(barcodeList)}">暂无条码，请添加国标或生成系统码</li>
                            <li class="bc-list-item"
                                th:each="row : ${barcodeList}"
                                th:attr="data-id=${row.id},data-code=${row.barcode}"
                                th:classappend="${row.barcode == previewCode} ? ' is-active' : ''">
                                <span class="bc-list-code" th:text="${row.barcode}">-</span>
                                <span class="bc-list-tag"
                                      th:classappend="${#strings.startsWith(row.barcode,'29')} ? ' is-sys' : (${#strings.startsWith(row.barcode,'69')} ? ' is-gb' : '')"
                                      th:text="${#strings.startsWith(row.barcode,'29')} ? '系统码' : (${#strings.startsWith(row.barcode,'69')} ? '国标' : '其它')">-</span>
                                <button type="button" class="layui-btn layui-btn-xs layui-btn-danger btn-del-bc">删除</button>
                            </li>
                        </ul>
                        <div class="field-tip">点击某条可选中预览/打印；每 SPU 最多一条 29 系统码；可同时保留国标 69。</div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">添加条码</label>
                    <div class="layui-input-block">
                        <div class="bc-input-row">
                            <input type="text" name="barcode" id="barcodeInput" class="layui-input"
                                   maxlength="13" autocomplete="off"
                                   placeholder="扫枪填入或手填 13 位">
                            <button type="button" class="layui-btn layui-btn-sm" id="btnAddBc">添加</button>
                            <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnGenerate">生成系统码</button>
                        </div>
                        <div class="field-tip">
                            国标 69 可手填/扫入；无国标时点「生成系统码」出 29 开头 EAN-13 并直接落库。
                        </div>
                    </div>
                </div>

                <div class="layui-form-item timo-finally">
                    <button type="button" class="layui-btn layui-btn-warm" id="btnPrint">
                        <i class="fa fa-print"></i> 打印选中标签
                    </button>
                    <button type="button" class="layui-btn btn-secondary close-popup">
                        <i class="fa fa-times-circle"></i> 关闭
                    </button>
                </div>
            </div>

            <div class="bc-panel-right">
                <div class="bc-label-wrap bc-print-only">
                    <div class="bc-label" id="bcLabel">
                        <div class="bc-label-title" id="lblTitle"
                             th:text="${(editItem.brandName != null ? editItem.brandName : '-') + ' · ' + (editItem.name != null ? editItem.name : '-')}">-</div>
                        <div class="bc-label-row">等级：<span th:text="${gradeName != null and !#strings.isEmpty(gradeName) ? gradeName : '-'}">-</span></div>
                        <div class="bc-label-row">规格：<span th:text="${editItem.specShow != null and !#strings.isEmpty(editItem.specShow) ? editItem.specShow : '-'}">-</span></div>
                        <div class="bc-label-row">保质期：<span th:text="${editItem.expirationName != null ? editItem.expirationName : '-'}">-</span></div>
                        <div class="bc-label-row">官方价：<span id="lblPrice"
                                th:text="${editItem.officialPriceShow == '非卖品' ? '非卖品' : ((editItem.officialPriceShow != null and editItem.officialPriceShow != '-' ? editItem.officialPriceShow + '元' : '-'))}">-</span></div>
                        <img class="bc-label-img is-empty" id="lblBarcodeImg" alt="条码" src=""/>
                        <div class="bc-label-code" id="lblBarcodeText"></div>
                        <div class="bc-label-empty" id="lblEmpty">请添加或选中一条条码</div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<script th:replace="/common/template :: script"></script>
<script type="text/javascript" th:src="@{/js/plugins/jquery-3.3.1.min.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var spuId = /*[[${editItem.id}]]*/ 0;
    var addUrl = /*[[@{/business/chai/spu/barcode/add}]]*/ '';
    var deleteUrl = /*[[@{/business/chai/spu/barcode/delete}]]*/ '';
    var generateUrl = /*[[@{/business/chai/spu/barcode/generate/{id}(id=${editItem.id})}]]*/ '';
    var imageUrlBase = /*[[@{/business/chai/spu/barcode/image}]]*/ '';
    var selectedCode = /*[[${previewCode}]]*/ '';
    /*]]>*/
    layui.use(['layer'], function () {
        var layer = layui.layer;
        var $ = layui.$;

        function digitsOnly(v) {
            return (v || '').replace(/\D/g, '').substring(0, 13);
        }

        function tagHtml(code) {
            if ((code || '').indexOf('29') === 0) {
                return '<span class="bc-list-tag is-sys">系统码</span>';
            }
            if ((code || '').indexOf('69') === 0) {
                return '<span class="bc-list-tag is-gb">国标</span>';
            }
            return '<span class="bc-list-tag">其它</span>';
        }

        function refreshPreview() {
            var code = digitsOnly(selectedCode);
            var $img = $('#lblBarcodeImg');
            var $text = $('#lblBarcodeText');
            var $empty = $('#lblEmpty');
            if (code.length === 13) {
                $img.attr('src', imageUrlBase + '?code=' + encodeURIComponent(code) + '&w=320&h=70&_=' + Date.now())
                    .removeClass('is-empty');
                $text.text(code);
                $empty.hide();
            } else {
                $img.addClass('is-empty').attr('src', '');
                $text.text('');
                $empty.show();
            }
        }

        function setActiveByCode(code) {
            selectedCode = code || '';
            $('#bcList .bc-list-item').each(function () {
                var c = $(this).attr('data-code') || '';
                $(this).toggleClass('is-active', c === selectedCode);
            });
            refreshPreview();
        }

        function appendListItem(id, code) {
            $('#bcList .bc-list-empty').remove();
            var $li = $('<li class="bc-list-item"></li>')
                .attr('data-id', id)
                .attr('data-code', code)
                .append($('<span class="bc-list-code"></span>').text(code))
                .append($(tagHtml(code)))
                .append('<button type="button" class="layui-btn layui-btn-xs layui-btn-danger btn-del-bc">删除</button>');
            $('#bcList').append($li);
            setActiveByCode(code);
        }

        function ensureEmptyPlaceholder() {
            if ($('#bcList .bc-list-item').length === 0) {
                $('#bcList').html('<li class="bc-list-empty">暂无条码，请添加国标或生成系统码</li>');
                setActiveByCode('');
            }
        }

        $('#bcForm').on('submit', function (e) {
            e.preventDefault();
            return false;
        });

        $('#bcList').on('click', '.bc-list-item', function (e) {
            if ($(e.target).closest('.btn-del-bc').length) {
                return;
            }
            setActiveByCode($(this).attr('data-code') || '');
        });

        $('#bcList').on('click', '.btn-del-bc', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var $li = $(this).closest('.bc-list-item');
            var barcodeId = $li.attr('data-id');
            var code = $li.attr('data-code') || '';
            layer.confirm('确定删除条码 ' + code + '？', {icon: 3, title: '确认'}, function (idx) {
                layer.close(idx);
                var loading = layer.load(2);
                $.ajax({
                    url: deleteUrl,
                    type: 'POST',
                    data: {id: spuId, barcodeId: barcodeId},
                    success: function (res) {
                        layer.close(loading);
                        if (res.code == 200) {
                            var wasSelected = (code === selectedCode);
                            $li.remove();
                            if (wasSelected) {
                                var $first = $('#bcList .bc-list-item').first();
                                if ($first.length) {
                                    setActiveByCode($first.attr('data-code') || '');
                                } else {
                                    ensureEmptyPlaceholder();
                                }
                            } else {
                                ensureEmptyPlaceholder();
                            }
                            layer.msg('已删除');
                        } else {
                            layer.msg(res.msg || '删除失败');
                        }
                    },
                    error: function () {
                        layer.close(loading);
                        layer.msg('请求失败');
                    }
                });
            });
        });

        $('#barcodeInput').on('input', function () {
            var cleaned = digitsOnly($(this).val());
            if ($(this).val() !== cleaned) {
                $(this).val(cleaned);
            }
        });

        $('#barcodeInput').on('keydown', function (e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                $('#btnAddBc').click();
            }
        });

        $('#btnAddBc').on('click', function () {
            var code = digitsOnly($('#barcodeInput').val());
            if (code.length !== 13) {
                layer.msg('请输入13位条码');
                return;
            }
            var loading = layer.load(2);
            $.ajax({
                url: addUrl,
                type: 'POST',
                data: {id: spuId, barcode: code},
                success: function (res) {
                    layer.close(loading);
                    if (res.code == 200 && res.data) {
                        appendListItem(res.data.id, res.data.barcode);
                        $('#barcodeInput').val('');
                        layer.msg('已添加');
                    } else {
                        layer.msg(res.msg || '添加失败');
                    }
                },
                error: function () {
                    layer.close(loading);
                    layer.msg('请求失败');
                }
            });
        });

        $('#btnGenerate').on('click', function () {
            var loading = layer.load(2);
            $.ajax({
                url: generateUrl,
                type: 'POST',
                success: function (res) {
                    layer.close(loading);
                    if (res.code == 200 && res.data && res.data.barcode) {
                        var code = res.data.barcode;
                        var exists = false;
                        $('#bcList .bc-list-item').each(function () {
                            if ($(this).attr('data-code') === code) {
                                exists = true;
                            }
                        });
                        if (!exists) {
                            appendListItem(res.data.id, code);
                        } else {
                            setActiveByCode(code);
                        }
                        layer.msg(exists ? '已有系统码' : '已生成并保存');
                    } else {
                        layer.msg(res.msg || '生成失败');
                    }
                },
                error: function () {
                    layer.close(loading);
                    layer.msg('请求失败');
                }
            });
        });

        $('#btnPrint').on('click', function () {
            var code = digitsOnly(selectedCode);
            if (code.length !== 13) {
                layer.msg('请先选中一条有效条码再打印');
                return;
            }
            refreshPreview();
            setTimeout(function () {
                window.print();
            }, 120);
        });

        setTimeout(function () {
            $('#barcodeInput').focus();
            refreshPreview();
        }, 100);
    });
</script>
</body>
</html>
