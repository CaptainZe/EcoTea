<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/aun/Timo">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <title>编辑SPU</title>
    <style>
        .spu-form .layui-form-label {
            width: 110px;
        }
        .spu-form .layui-input-inline {
            width: 260px;
        }
        .spu-form .spec-inline {
            width: 78px;
        }
        .spu-form .spec-unit-inline {
            width: 100px;
        }
        .spu-form .spec-mid {
            float: left;
            display: block;
            padding: 9px 4px !important;
            line-height: 20px;
            color: #666;
        }
        .spu-form .layui-input-block {
            margin-left: 140px;
        }
        .spu-form .spu-row-name .layui-input-block {
            margin-left: 140px;
            max-width: none;
        }
        .spu-form .spu-row-name .layui-input-block .layui-input {
            width: 680px;
            max-width: 100%;
        }
        .spu-form .field-tip {
            color: #999;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 4px;
        }
        .upload-box {
            display: flex;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .upload-item {
            width: 120px;
            height: 120px;
            margin-right: 10px;
            margin-bottom: 10px;
            border: 1px dashed #ddd;
            position: relative;
            cursor: move;
        }
        .upload-item.dragging {
            opacity: .6;
            border-color: #5FB878;
        }
        .upload-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .delete-img {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .kw-chip-box {
            min-height: 42px;
            padding: 8px 10px;
            border: 1px solid #E5E7EB;
            border-radius: 4px;
            background: #FAFAFA;
            max-width: 680px;
        }
        .kw-chip {
            display: inline-block;
            margin: 0 6px 6px 0;
            padding: 2px 8px 2px 10px;
            background: #ECFDF5;
            color: #047857;
            border: 1px solid #A7F3D0;
            border-radius: 3px;
            font-size: 13px;
            line-height: 22px;
        }
        .kw-chip .kw-x {
            margin-left: 6px;
            cursor: pointer;
            color: #059669;
            font-weight: 700;
        }
        .kw-chip .kw-x:hover { color: #DC2626; }
        .kw-empty { color: #9CA3AF; font-size: 13px; }
        .kw-add-row { margin-top: 10px; display: flex; gap: 8px; align-items: center; max-width: 680px; }
        .kw-add-row .layui-input { flex: 1; max-width: 280px; }
        .kw-search-text {
            margin-top: 4px;
            padding: 8px 10px;
            background: #F3F4F6;
            border-radius: 4px;
            color: #374151;
            font-size: 13px;
            word-break: break-all;
            min-height: 20px;
            max-width: 680px;
        }
        .mark-section {
            margin: 8px 0 18px;
            padding: 14px 12px 6px;
            border-top: 1px solid #E5E7EB;
            background: #F9FAFB;
            border-radius: 0 0 4px 4px;
        }
        .mark-section .mark-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin: 0 0 12px 0;
            padding-left: 4px;
            letter-spacing: 0.02em;
        }
        .mark-section .layui-form-label {
            width: 90px;
        }
        .mark-section .layui-input-block {
            margin-left: 120px;
        }
        .mark-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
            min-height: 28px;
        }
        .mark-row .layui-form-checkbox {
            flex: 0 0 auto;
            margin-top: 0 !important;
        }
        .mark-row .mark-desc {
            color: #6B7280;
            font-size: 12px;
            line-height: 22px;
            padding-top: 2px;
        }
        .pack-spu-wrap {
            max-width: 560px;
        }
        .pack-spu-picked {
            margin-top: 6px;
            font-size: 13px;
            color: #047857;
            min-height: 20px;
        }
        .pack-spu-picked.is-empty {
            color: #9CA3AF;
        }
    </style>
</head>
<body>
<div th:if="${errorMsg != null}" class="layui-form timo-compile" style="padding: 24px;">
    <p style="color: #B91C1C; font-size: 14px;" th:text="${errorMsg}"></p>
    <div class="layui-form-item timo-finally">
        <button type="button" class="layui-btn btn-secondary close-popup">
            <i class="fa fa-times-circle"></i> 关闭
        </button>
    </div>
</div>
<div th:if="${errorMsg == null}" class="layui-form timo-compile">
    <form id="editform" class="layui-form spu-form" method="POST">
        <input type="hidden" name="id" th:if="${editItem}" th:value="${editItem.id}"/>

        <div class="layui-form-item spu-row-name">
            <label class="layui-form-label required">商品名称</label>
            <div class="layui-input-block">
                <input type="text" name="name" id="spuNameInput" class="layui-input" th:value="${editItem?.name}"
                       required lay-verify="required" maxlength="255" placeholder="如: 斑竹窠肉桂">
            </div>
        </div>

        <!-- 搜索关键词录入暂不上线：UI 隐藏，仍回传已有 keywords，避免保存清空 -->
        <input type="hidden" name="keywords" id="keywordsHidden" th:value="${editItem?.keywords}"/>
        <div class="layui-form-item spu-row-name" style="display:none;" aria-hidden="true">
            <label class="layui-form-label">搜索关键词</label>
            <div class="layui-input-block">
                <div class="kw-chip-box" id="kwChipBox">
                    <span class="kw-empty">暂无关键词，在下方输入后添加</span>
                </div>
                <div class="kw-add-row">
                    <input type="text" id="kwInput" class="layui-input"
                           th:attr="maxlength=${maxKeywordLength}"
                           placeholder="输入关键词，回车或点添加">
                    <button type="button" class="layui-btn layui-btn-sm" id="btnAddKw">添加</button>
                </div>
                <div class="field-tip">
                    最多 <span th:text="${maxKeywordCount}">20</span> 个，每个不超过
                    <span th:text="${maxKeywordLength}">20</span> 字；保存后下属 SKU 自动继承。
                    也可在列表「关键词」入口单独维护。
                </div>
                <div class="kw-search-text" id="searchTextPreview"
                     th:text="${editItem?.searchText != null and !#strings.isEmpty(editItem.searchText) ? editItem.searchText : '保存后自动生成：品牌名 + 商品名 + 关键词'}">
                    保存后自动生成
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label required">星级</label>
            <div class="layui-input-inline">
                <select class="timo-search-select" name="starLevel" mo:dict="STAR_LEVEL"
                        mo-selected="${editItem.starLevel}" lay-verify="required"></select>
            </div>
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline">
                <th:block th:if="${hasSku == null or !hasSku}">
                    <input type="hidden" name="status" th:value="0"/>
                    <input type="text" class="layui-input" value="下架" disabled>
                    <div class="field-tip">尚无 SKU 时状态固定为下架</div>
                </th:block>
                <th:block th:if="${hasSku != null and hasSku}">
                    <select class="timo-search-select" name="status" mo:dict="CHAI_STATUS"
                            mo-selected="${editItem.status}" lay-verify="required"></select>
                    <div class="field-tip">上下架为总开关，会同步该SPU下全部SKU；不需要的半年请删除SKU</div>
                </th:block>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label required">品牌</label>
            <div class="layui-input-inline">
                <select name="brand" class="layui-input timo-search-select" lay-search lay-filter="brand" lay-verify="required">
                    <option value="">请选择品牌</option>
                    <option th:each="b : ${brandList}" th:value="${b.id}"
                            th:selected="${editItem.brand != null and editItem.brand == b.id}"
                            th:text="${b.name}"></option>
                </select>
            </div>
            <label class="layui-form-label required">茶类</label>
            <div class="layui-input-inline">
                <select class="timo-search-select" name="type" mo:dict="CHAI_TYPE"
                        mo-selected="${editItem.type}" lay-verify="required"></select>
            </div>
            <label class="layui-form-label required">等级</label>
            <div class="layui-input-inline">
                <select class="timo-search-select" name="grade" mo:dict="CHAI_GRADE"
                        mo-selected="${editItem.grade}" lay-verify="required"></select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label required">年份</label>
            <div class="layui-input-inline">
                <input type="number" name="year" class="layui-input" list="yearDatalist"
                       th:value="${editItem?.year}" required lay-verify="required" placeholder="可输入或选择">
                <datalist id="yearDatalist">
                    <option th:each="y : ${yearOptions}" th:value="${y}"></option>
                </datalist>
                <div class="field-tip">可手输，也可选当前年及近5年</div>
            </div>
            <label class="layui-form-label required">生产批次</label>
            <div class="layui-input-inline">
                <select class="timo-search-select" name="prodBatch" mo:dict="CHAI_PROD_BATCH"
                        mo-selected="${editItem.prodBatch}" lay-verify="required"></select>
            </div>
            <label class="layui-form-label required">保质期</label>
            <div class="layui-input-inline">
                <select name="expiration" class="layui-input timo-search-select" lay-search lay-verify="required">
                    <option value="">请选择</option>
                    <option th:each="e : ${expirationList}" th:value="${e.id}"
                            th:selected="${editItem.expiration != null and editItem.expiration == e.id}"
                            th:text="${e.name}"></option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label required">非卖品</label>
            <div class="layui-input-inline">
                <select class="timo-search-select" name="nonSale" mo:dict="YES_OR_NO"
                        mo-selected="${editItem.nonSale != null ? editItem.nonSale : 0}"
                        lay-filter="nonSale" lay-verify="required"></select>
            </div>
            <label class="layui-form-label required" id="officialPriceLabel">官方价(元)</label>
            <div class="layui-input-inline">
                <input type="number" step="0.01" min="0.01" name="officialPrice" id="officialPrice"
                       class="layui-input"
                       th:value="${editItem?.officialPrice}"
                       th:attr="disabled=${editItem.nonSale != null and editItem.nonSale == 1}"
                       placeholder="官方价">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label required">规格</label>
            <div class="layui-input-inline spec-inline">
                <input type="number" step="0.01" min="0.01" name="totalNetWeight" class="layui-input"
                       th:value="${editItem?.totalNetWeight}" required lay-verify="required|number"
                       placeholder="总净重">
            </div>
            <div class="spec-mid">g (</div>
            <div class="layui-input-inline spec-inline">
                <input type="number" step="0.01" min="0.01" name="unitWeight" class="layui-input"
                       th:value="${editItem?.unitWeight}" required lay-verify="required|number"
                       placeholder="单份">
            </div>
            <div class="spec-mid">g *</div>
            <div class="layui-input-inline spec-inline">
                <input type="number" name="unitCount" class="layui-input"
                       th:value="${editItem?.unitCount}" required lay-verify="required|number" min="1"
                       placeholder="份数">
            </div>
            <div class="layui-input-inline spec-unit-inline">
                <select class="timo-search-select" name="unitLabel" mo:dict="CHAI_SPEC_LABEL"
                        mo-selected="${editItem.unitLabel}" lay-verify="required"></select>
            </div>
            <div class="spec-mid">)</div>
            <div class="layui-form-mid layui-word-aux" style="margin-left:8px;">示例：136g(4g*34泡)</div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">官方展示图</label>
            <div class="layui-input-block">
                <button type="button" class="layui-btn image-upload">
                    <i class="layui-icon">&#xe67c;</i> 上传官方展示图
                </button>
                <div class="upload-box" id="imagePreviewBox"></div>
                <input type="hidden" id="showImageUrls" name="showImageUrls" th:value="${editItem.showImageUrls}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">实物鉴定图</label>
            <div class="layui-input-block">
                <button type="button" class="layui-btn real-image-upload">
                    <i class="layui-icon">&#xe67c;</i> 上传实物鉴定图
                </button>
                <div class="upload-box" id="realImagePreviewBox"></div>
                <input type="hidden" id="realImageUrls" name="realImageUrls" th:value="${editItem.realImageUrls}">
            </div>
        </div>

        <div class="mark-section">
            <div class="mark-title">标记区</div>
            <input type="hidden" name="hideExternal" id="hideExternalVal"
                   th:value="${editItem.hideExternal != null and editItem.hideExternal == 1 ? 1 : 0}"/>
            <input type="hidden" name="coreFlag" id="coreFlagVal"
                   th:value="${editItem.coreFlag != null and editItem.coreFlag == 1 ? 1 : 0}"/>
            <input type="hidden" name="tastingFlag" id="tastingFlagVal"
                   th:value="${editItem.tastingFlag != null and editItem.tastingFlag == 1 ? 1 : 0}"/>
            <input type="hidden" name="packSpuId" id="packSpuId"
                   th:value="${editItem.packSpuId != null ? editItem.packSpuId : ''}"/>

            <div class="layui-form-item">
                <label class="layui-form-label">标记项</label>
                <div class="layui-input-block">
                    <div class="mark-row">
                        <input type="checkbox" title="对外隐藏" lay-skin="primary" lay-filter="markHideExternal"
                               id="chkHideExternal"
                               th:checked="${editItem.hideExternal != null and editItem.hideExternal == 1}">
                        <span class="mark-desc">对外在售入口查不到（内部价目 / 小程序仍可见）</span>
                    </div>
                    <div class="mark-row">
                        <input type="checkbox" title="核心产品" lay-skin="primary" lay-filter="markCoreFlag"
                               id="chkCoreFlag"
                               th:checked="${editItem.coreFlag != null and editItem.coreFlag == 1}">
                        <span class="mark-desc">价格透明 / 公众号文章推广等</span>
                    </div>
                    <div class="mark-row">
                        <input type="checkbox" title="品鉴款" lay-skin="primary" lay-filter="markTastingFlag"
                               id="chkTastingFlag"
                               th:checked="${editItem.tastingFlag != null and editItem.tastingFlag == 1}">
                        <span class="mark-desc">可挂整装 SPU；取消品鉴会清空整装</span>
                    </div>
                </div>
            </div>

            <div class="layui-form-item" id="packSpuRow"
                 th:style="${editItem.tastingFlag != null and editItem.tastingFlag == 1} ? '' : 'display:none;'">
                <label class="layui-form-label">整装 SPU</label>
                <div class="layui-input-block">
                    <div class="pack-spu-wrap">
                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                            <button type="button" class="layui-btn layui-btn-sm" id="btnPickPack">选择整装 SPU</button>
                            <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="btnClearPack">清除</button>
                        </div>
                        <div class="pack-spu-picked"
                             id="packSpuPicked"
                             th:classappend="${packSpuLabel == null or #strings.isEmpty(packSpuLabel)} ? ' is-empty' : ''"
                             th:text="${packSpuLabel != null and !#strings.isEmpty(packSpuLabel) ? ('已选：' + packSpuLabel) : '未指定整装（可选）'}">
                            未指定整装（可选）
                        </div>
                    </div>
                    <div class="field-tip">弹窗按名称 / 编码 / 条码筛选；不含品鉴款与当前 SPU。</div>
                </div>
            </div>
        </div>

        <div class="layui-form-item timo-finally">
            <button type="submit" class="layui-btn" lay-submit lay-filter="submitForm">
                <i class="fa fa-check-circle"></i> 保存
            </button>
            <button type="button" class="layui-btn layui-btn-normal" lay-submit lay-filter="submitNext">
                <i class="fa fa-arrow-right"></i> 下一步（维护SKU）
            </button>
            <button type="button" class="layui-btn btn-secondary close-popup">
                <i class="fa fa-times-circle"></i> 关闭
            </button>
        </div>
    </form>
</div>
<script th:replace="/common/template :: script"></script>
<script type="text/javascript" th:src="@{/js/plugins/jquery-3.3.1.min.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var maxKwCount = /*[[${maxKeywordCount}]]*/ 20;
    var maxKwLen = /*[[${maxKeywordLength}]]*/ 20;
    var currentSpuId = /*[[${editItem != null and editItem.id != null ? editItem.id : null}]]*/ null;
    var initialPackLabel = /*[[${packSpuLabel != null ? packSpuLabel : ''}]]*/ '';
    var packPickUrl = /*[[@{/business/chai/spu/packPick}]]*/ '/business/chai/spu/packPick';
    /*]]>*/
    layui.use(['upload', 'form', 'layer'], function () {
        var upload = layui.upload;
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.jquery;
        if (!$('#editform').length) {
            return;
        }
        var draggingEl = null;
        var imageList = [];
        var realImageList = [];
        var kwTokens = [];
        var packLabelCache = initialPackLabel || '';

        function parseKwInitial() {
            var raw = ($('#keywordsHidden').val() || '').trim();
            if (!raw) {
                return [];
            }
            raw = raw.replace(/，/g, ' ').replace(/,/g, ' ');
            var list = [];
            var seen = {};
            raw.split(/\s+/).forEach(function (p) {
                p = (p || '').trim();
                if (!p) {
                    return;
                }
                if (p.length > maxKwLen) {
                    p = p.substring(0, maxKwLen);
                }
                var key = p.toLowerCase();
                if (seen[key]) {
                    return;
                }
                seen[key] = true;
                list.push(p);
            });
            return list.slice(0, maxKwCount);
        }

        function currentBrandName() {
            var $opt = $('select[name="brand"] option:selected');
            if (!$opt.length || !$opt.val()) {
                return '';
            }
            return ($opt.text() || '').trim();
        }

        function syncKwHidden() {
            $('#keywordsHidden').val(kwTokens.join(' '));
            var parts = [];
            var bn = currentBrandName();
            var pn = ($('#spuNameInput').val() || '').trim();
            if (bn) {
                parts.push(bn);
            }
            if (pn) {
                parts.push(pn);
            }
            if (kwTokens.length) {
                parts.push(kwTokens.join(' '));
            }
            $('#searchTextPreview').text(parts.length ? parts.join(' ') : '（空）');
        }

        function renderKwChips() {
            var $box = $('#kwChipBox');
            $box.empty();
            if (!kwTokens.length) {
                $box.append('<span class="kw-empty">暂无关键词，在下方输入后添加</span>');
            } else {
                kwTokens.forEach(function (t, idx) {
                    var $chip = $('<span class="kw-chip"></span>');
                    $chip.append(document.createTextNode(t));
                    $chip.append($('<span class="kw-x" title="删除">×</span>').attr('data-idx', idx));
                    $box.append($chip);
                });
            }
            syncKwHidden();
        }

        function addKwToken(raw) {
            var t = (raw || '').trim();
            if (!t) {
                return;
            }
            if (t.length > maxKwLen) {
                t = t.substring(0, maxKwLen);
            }
            if (kwTokens.length >= maxKwCount) {
                layer.msg('最多 ' + maxKwCount + ' 个关键词');
                return;
            }
            var key = t.toLowerCase();
            for (var i = 0; i < kwTokens.length; i++) {
                if (kwTokens[i].toLowerCase() === key) {
                    layer.msg('关键词已存在');
                    return;
                }
            }
            kwTokens.push(t);
            renderKwChips();
        }

        kwTokens = parseKwInitial();
        renderKwChips();
        $('#btnAddKw').on('click', function () {
            addKwToken($('#kwInput').val());
            $('#kwInput').val('').focus();
        });
        $('#kwInput').on('keydown', function (e) {
            if (e.keyCode === 13) {
                e.preventDefault();
                addKwToken($(this).val());
                $(this).val('');
            }
        });
        $('#kwChipBox').on('click', '.kw-x', function () {
            var idx = parseInt($(this).attr('data-idx'), 10);
            if (!isNaN(idx)) {
                kwTokens.splice(idx, 1);
                renderKwChips();
            }
        });
        $('#spuNameInput').on('input', syncKwHidden);
        form.on('select(brand)', function () {
            syncKwHidden();
        });
        $('select[name="brand"]').on('change', syncKwHidden);
        form.render('select');

        function applyNonSaleUi(isNonSale) {
            var $official = $('#officialPrice');
            var $label = $('#officialPriceLabel');
            if (isNonSale) {
                $official.val('').prop('disabled', true)
                    .removeAttr('required').removeAttr('lay-verify');
                $label.removeClass('required');
            } else {
                $official.prop('disabled', false)
                    .attr('required', true).attr('lay-verify', 'required|number');
                $label.addClass('required');
                if (!$official.val()) {
                    $official.val('1');
                }
            }
        }

        form.on('select(nonSale)', function (data) {
            applyNonSaleUi(String(data.value) === '1');
        });
        applyNonSaleUi(String($('select[name="nonSale"]').val()) === '1');

        function syncMarkHidden(flagId, checked) {
            $(flagId).val(checked ? '1' : '0');
        }

        function updatePackPickedUi() {
            var id = ($('#packSpuId').val() || '').trim();
            var $picked = $('#packSpuPicked');
            if (id && packLabelCache) {
                $picked.removeClass('is-empty').text('已选：' + packLabelCache);
            } else if (id) {
                $picked.removeClass('is-empty').text('已选：ID ' + id);
            } else {
                $picked.addClass('is-empty').text('未指定整装（可选）');
            }
        }

        function clearPackSpu() {
            $('#packSpuId').val('');
            packLabelCache = '';
            updatePackPickedUi();
        }

        function applyTastingUi(isTasting) {
            syncMarkHidden('#tastingFlagVal', isTasting);
            if (isTasting) {
                $('#packSpuRow').show();
            } else {
                $('#packSpuRow').hide();
                clearPackSpu();
            }
        }

        form.on('checkbox(markHideExternal)', function (data) {
            syncMarkHidden('#hideExternalVal', data.elem.checked);
        });
        form.on('checkbox(markCoreFlag)', function (data) {
            syncMarkHidden('#coreFlagVal', data.elem.checked);
        });
        form.on('checkbox(markTastingFlag)', function (data) {
            applyTastingUi(data.elem.checked);
        });
        syncMarkHidden('#hideExternalVal', $('#chkHideExternal').prop('checked'));
        syncMarkHidden('#coreFlagVal', $('#chkCoreFlag').prop('checked'));
        var tastingOn = $('#chkTastingFlag').prop('checked');
        syncMarkHidden('#tastingFlagVal', tastingOn);
        if (tastingOn) {
            $('#packSpuRow').show();
            updatePackPickedUi();
        } else {
            $('#packSpuRow').hide();
            clearPackSpu();
        }
        form.render('checkbox');

        window.onPackSpuPicked = function (row) {
            if (!row || !row.id) {
                return;
            }
            $('#packSpuId').val(String(row.id));
            packLabelCache = row.label || '';
            updatePackPickedUi();
        };

        $('#btnPickPack').on('click', function () {
            var url = packPickUrl;
            if (currentSpuId) {
                url += (url.indexOf('?') >= 0 ? '&' : '?') + 'excludeId=' + encodeURIComponent(currentSpuId);
            }
            layer.open({
                type: 2,
                title: '选择整装 SPU',
                area: ['92%', '90%'],
                maxmin: true,
                content: url
            });
        });
        $('#btnClearPack').on('click', function () {
            clearPackSpu();
        });

        initImageGroup({
            uploadElem: '.image-upload',
            inputId: '#showImageUrls',
            boxId: '#imagePreviewBox',
            imageListRef: function () { return imageList; },
            setImageList: function (list) { imageList = list; }
        });
        initImageGroup({
            uploadElem: '.real-image-upload',
            inputId: '#realImageUrls',
            boxId: '#realImagePreviewBox',
            imageListRef: function () { return realImageList; },
            setImageList: function (list) { realImageList = list; }
        });

        $(document).on('click', '.delete-img', function () {
            var $item = $(this).closest('.upload-item');
            var url = $item.data('url');
            var inputId = $item.data('input-id');
            var list = getImageListByInputId(inputId).filter(function (item) {
                return item !== url;
            });
            setImageListByInputId(inputId, list);
            $item.remove();
            syncInput(inputId);
        });

        $(document).on('dragstart', '.upload-item', function (e) {
            draggingEl = this;
            $(this).addClass('dragging');
            if (e.originalEvent && e.originalEvent.dataTransfer) {
                e.originalEvent.dataTransfer.effectAllowed = 'move';
            }
        });
        $(document).on('dragend', '.upload-item', function () {
            $(this).removeClass('dragging');
            draggingEl = null;
        });
        $(document).on('dragover', '.upload-item', function (e) {
            e.preventDefault();
            if (!draggingEl || draggingEl === this) {
                return;
            }
            if ($(draggingEl).data('input-id') !== $(this).data('input-id')) {
                return;
            }
            var rect = this.getBoundingClientRect();
            var insertBefore = (e.originalEvent.clientX - rect.left) < rect.width / 2;
            if (insertBefore) {
                this.parentNode.insertBefore(draggingEl, this);
            } else {
                this.parentNode.insertBefore(draggingEl, this.nextSibling);
            }
        });
        $(document).on('drop', '.upload-item', function (e) {
            e.preventDefault();
            rebuildImageListFromDom($(this).data('input-id'));
        });

        form.on('submit(submitForm)', function () {
            saveSpu(false, false);
            return false;
        });
        form.on('submit(submitNext)', function () {
            saveSpu(true, false);
            return false;
        });

        function saveSpu(goNext, confirmDuplicate) {
            syncKwHidden();
            syncMarkHidden('#hideExternalVal', $('#chkHideExternal').prop('checked'));
            syncMarkHidden('#coreFlagVal', $('#chkCoreFlag').prop('checked'));
            var tastingOn = $('#chkTastingFlag').prop('checked');
            syncMarkHidden('#tastingFlagVal', tastingOn);
            if (!tastingOn) {
                clearPackSpu();
            }
            var $pack = $('#packSpuId');
            var packEmpty = !($pack.val() || '').trim();
            if (packEmpty) {
                $pack.prop('disabled', true);
            }
            var data = $('#editform').serialize();
            if (packEmpty) {
                $pack.prop('disabled', false);
            }
            if (confirmDuplicate) {
                data += '&confirmDuplicate=true';
            }
            $.ajax({
                url: '/business/chai/spu/save',
                type: 'POST',
                data: data,
                success: function (res) {
                    if (res.code == 200) {
                        var payload = res.data || {};
                        var spuId = (payload && typeof payload === 'object')
                            ? payload.spuId
                            : payload;
                        if (!spuId) {
                            window.parent.location.reload();
                            return;
                        }
                        var skuUrl = '/business/chai/sku/editBySpu/' + spuId;
                        if (goNext) {
                            window.location.href = skuUrl;
                            return;
                        }
                        if (payload.needSkuForAnchor) {
                            layer.confirm('当前锚点半年尚无SKU，是否前往维护？', {
                                icon: 3,
                                title: '维护SKU',
                                btn: ['前往维护', '稍后']
                            }, function (index) {
                                layer.close(index);
                                window.location.href = skuUrl;
                            }, function () {
                                window.parent.location.reload();
                            });
                            return;
                        }
                        window.parent.location.reload();
                    } else if (res.code == 409) {
                        layer.confirm(res.msg || '同品牌下已存在同名商品，是否仍要继续保存？', {
                            icon: 3,
                            title: '重复提醒'
                        }, function (index) {
                            layer.close(index);
                            saveSpu(goNext, true);
                        });
                    } else {
                        alert(res.msg || '保存失败');
                    }
                }
            });
        }

        function initImageGroup(config) {
            var imageUrlsStr = $(config.inputId).val();
            if (imageUrlsStr) {
                try {
                    var imageListTemp = JSON.parse(imageUrlsStr);
                    config.setImageList(imageListTemp);
                    imageListTemp.forEach(function (url) {
                        renderImage(url, config.boxId, config.inputId);
                    });
                } catch (e) {
                    console.error(config.inputId + ' is not valid json');
                }
            }
            syncInput(config.inputId);

            upload.render({
                elem: config.uploadElem,
                url: '/business/upload/file',
                field: 'file',
                multiple: true,
                number: 9,
                acceptMime: 'image/*',
                exts: 'jpg|jpeg|png|gif|webp',
                done: function (res) {
                    if (res.code !== 0) {
                        layer.msg('上传失败');
                        return;
                    }
                    var imageListTemp = config.imageListRef();
                    imageListTemp.push(res.data.src);
                    renderImage(res.data.src, config.boxId, config.inputId);
                    syncInput(config.inputId);
                    layer.msg('上传成功');
                }
            });
        }

        function renderImage(url, boxId, inputId) {
            $(boxId).append(
                '<div class="upload-item" draggable="true" data-url="' + url + '" data-input-id="' + inputId + '">' +
                '   <img src="' + url + '">' +
                '   <div class="delete-img" data-url="' + url + '">×</div>' +
                '</div>'
            );
        }

        function rebuildImageListFromDom(inputId) {
            var imageListTemp = [];
            $(getBoxIdByInputId(inputId) + ' .upload-item').each(function () {
                var url = $(this).data('url');
                if (url) {
                    imageListTemp.push(url);
                }
            });
            setImageListByInputId(inputId, imageListTemp);
            syncInput(inputId);
        }

        function syncInput(inputId) {
            $(inputId).val(JSON.stringify(getImageListByInputId(inputId)));
        }

        function getImageListByInputId(inputId) {
            return inputId === '#realImageUrls' ? realImageList : imageList;
        }

        function setImageListByInputId(inputId, list) {
            if (inputId === '#realImageUrls') {
                realImageList = list;
                return;
            }
            imageList = list;
        }

        function getBoxIdByInputId(inputId) {
            return inputId === '#realImageUrls' ? '#realImagePreviewBox' : '#imagePreviewBox';
        }
    });
</script>
</body>
</html>
