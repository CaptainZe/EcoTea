<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <title>合作方仪表盘</title>
    <th:block th:fragment="style">
        <th:block th:replace="/business/tea/teaOverview/fragments :: teaOverviewCss"/>
        <style>
            .tea-partner-region-hint {
                float: right;
                font-size: 13px;
                font-weight: 400;
                color: #6b7280;
            }
        </style>
    </th:block>
</head>
<body>
<div class="tea-overview-wrap">

    <div class="layui-row layui-col-space15">
        <div class="layui-col-md4">
            <div class="tea-overview-card">
                <div class="label">合作方总数</div>
                <div class="value" style="color: #6366f1;" th:text="${partnerDash.totalCount}">0</div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="tea-overview-card">
                <div class="label">签约总数</div>
                <div class="value" style="color: #16a34a;" th:text="${partnerDash.signedCount}">0</div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="tea-overview-card">
                <div class="label">解约总数</div>
                <div class="value" style="color: #dc2626;" th:text="${partnerDash.terminatedCount}">0</div>
            </div>
        </div>
    </div>

    <div class="layui-row layui-col-space15" style="margin-top: 2px;">
        <div class="layui-col-md6">
            <div class="tea-chart-card">
                <div class="tea-chart-title">
                    各省合作方数量
                    <span class="tea-partner-region-hint">点击柱条查看省内各市</span>
                </div>
                <div id="teaPartnerProvinceBar" class="tea-chart-box tea-chart-box-wide"></div>
            </div>
        </div>
        <div class="layui-col-md6">
            <div class="tea-chart-card">
                <div class="tea-chart-title">
                    <span id="teaPartnerCityTitle">各市合作方数量</span>
                </div>
                <div id="teaPartnerCityBar" class="tea-chart-box tea-chart-box-wide"></div>
            </div>
        </div>
    </div>

    <div class="layui-row layui-col-space15" style="margin-top: 2px;">
        <div class="layui-col-md12">
            <div class="tea-chart-card tea-brand-table">
                <div class="tea-chart-title">对接客服负责的合作方数</div>
                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>对接客服</th>
                        <th width="120">合作方数</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(partnerDash.liaisonPartnerRankList)}">
                        <td colspan="2" style="text-align:center;color:#9ca3af;">暂无数据</td>
                    </tr>
                    <tr th:each="row : ${partnerDash.liaisonPartnerRankList}">
                        <td th:text="${row.displayName}">-</td>
                        <td th:text="${row.partnerCount}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:replace="/common/template :: script"></script>
<script th:src="@{/echarts/echarts.min.js}"></script>
<script th:inline="javascript">
    layui.use(['jquery', 'layer'], function () {
        var $ = layui.$;
        var layer = layui.layer;

        var cityStatsUrl = /*[[@{/business/tea/teaOverview/partner/cityStats}]]*/ '/business/tea/teaOverview/partner/cityStats';
        var initialProvince = /*[[${partnerProvinceJson}]]*/ '[]';

        function parseJsonArray(raw) {
            try {
                var arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
                return Array.isArray(arr) ? arr : [];
            } catch (e) {
                return [];
            }
        }

        function regionCode(r) {
            return r.regionCode != null ? r.regionCode : r.region_code;
        }
        function regionName(r) {
            return r.regionName != null ? r.regionName : r.region_name;
        }
        function regionCnt(r) {
            var v = r.partnerCount != null ? r.partnerCount : r.partner_count;
            return Number(v) || 0;
        }

        var provinceList = parseJsonArray(initialProvince);
        var selectedProvinceIndex = -1;
        var provinceChart = echarts.init(document.getElementById('teaPartnerProvinceBar'));
        var cityChart = echarts.init(document.getElementById('teaPartnerCityBar'));

        function setRegionBar(chart, list, barColor) {
            var names = list.map(regionName);
            var vals = list.map(regionCnt);
            chart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: 44, right: 16, top: 16, bottom: names.length > 8 ? 72 : 48 },
                xAxis: {
                    type: 'category',
                    data: names.length ? names : ['暂无数据'],
                    axisLabel: { interval: 0, rotate: names.length > 6 ? 28 : 0 }
                },
                yAxis: { type: 'value', name: '合作方数', minInterval: 1 },
                series: [{
                    type: 'bar',
                    data: names.length ? vals : [0],
                    itemStyle: { color: barColor, borderRadius: [6, 6, 0, 0] },
                    barMaxWidth: 40
                }]
            }, true);
        }

        function renderProvinceChart() {
            var names = provinceList.map(regionName);
            var vals = provinceList.map(regionCnt);
            var colors = provinceList.map(function (_, idx) {
                return idx === selectedProvinceIndex ? '#4338ca' : '#6366f1';
            });
            provinceChart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: 44, right: 16, top: 16, bottom: names.length > 8 ? 72 : 48 },
                xAxis: {
                    type: 'category',
                    data: names.length ? names : ['暂无数据'],
                    axisLabel: { interval: 0, rotate: names.length > 6 ? 28 : 0 }
                },
                yAxis: { type: 'value', name: '合作方数', minInterval: 1 },
                series: [{
                    type: 'bar',
                    data: names.length ? vals.map(function (v, idx) {
                        return { value: v, itemStyle: { color: colors[idx], borderRadius: [6, 6, 0, 0] } };
                    }) : [0],
                    barMaxWidth: 40
                }]
            }, true);
        }

        function updateCityTitle(provinceName) {
            var titleEl = document.getElementById('teaPartnerCityTitle');
            if (!provinceName) {
                titleEl.textContent = '各市合作方数量';
                return;
            }
            titleEl.textContent = provinceName + ' · 各市合作方数量';
        }

        function loadCityStats(provinceRow, index) {
            if (!provinceRow) {
                updateCityTitle(null);
                setRegionBar(cityChart, [], '#8b5cf6');
                return;
            }
            selectedProvinceIndex = index;
            renderProvinceChart();
            updateCityTitle(regionName(provinceRow));
            $.get(cityStatsUrl, { provinceCode: regionCode(provinceRow) }, function (res) {
                if (res && res.code === 200) {
                    setRegionBar(cityChart, res.data || [], '#8b5cf6');
                } else {
                    setRegionBar(cityChart, [], '#8b5cf6');
                    if (res && res.msg) {
                        layer.msg(res.msg);
                    }
                }
            }).fail(function () {
                setRegionBar(cityChart, [], '#8b5cf6');
                layer.msg('加载市级统计失败');
            });
        }

        provinceChart.on('click', function (params) {
            if (params.dataIndex == null || params.dataIndex < 0 || params.dataIndex >= provinceList.length) {
                return;
            }
            loadCityStats(provinceList[params.dataIndex], params.dataIndex);
        });

        renderProvinceChart();
        if (provinceList.length > 0) {
            loadCityStats(provinceList[0], 0);
        } else {
            updateCityTitle(null);
            setRegionBar(cityChart, [], '#8b5cf6');
        }

        window.addEventListener('resize', function () {
            provinceChart.resize();
            cityChart.resize();
        });
    });
</script>
</body>
</html>
